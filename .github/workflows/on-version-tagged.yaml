name: on-version-tagged

# Fires on tags pushed by the vnext version-and-tag workflow.
# Two jobs:
#   1. release    — create a GitHub release with auto-generated notes.
#   2. goreleaser — build signed multi-arch binaries and publish them as
#                   release assets, matching Terraform Registry's
#                   discovery contract (provider binaries + SHA256SUMS
#                   + SHA256SUMS.sig + terraform-registry-manifest.json).
#
# Requires repo secrets:
#   GPG_PRIVATE_KEY — armor-exported GPG private key
#   PASSPHRASE      — passphrase for the GPG key

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    uses: unbounded-tech/workflow-simple-release/.github/workflows/workflow.yaml@v2.1.3
    with:
      tag: ${{ github.ref_name }}
      name: ${{ github.ref_name }}

  goreleaser:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # goreleaser needs full history to derive changelog/version info.
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
